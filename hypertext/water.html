    <h4>A small discovery...</h4>
    <p>It is a watering can. You remember the sound of it hitting the stone floor. <strong>CLANG.</strong></p>
    <p>The memory makes you feel heavy. Solid. For a moment, you almost have a shadow.</p>
    <p>You follow the trail of rust toward <a href="bench.html">the moonlight</a>, or retreat to <a href="index.html">the entryway</a>.</p>
